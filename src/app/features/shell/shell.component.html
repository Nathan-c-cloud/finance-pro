<div class="shell">
  <header class="header-wrap">
    <div class="pill" [class.scrolled]="scrolled()">
      <a class="brand" routerLink="/mois" aria-label="Suivi Budget, accueil">
        <span class="logo">€</span>
        <span class="brand-name">Suivi Budget</span>
      </a>

      <nav class="links" aria-label="Navigation principale">
        <a routerLink="/mois" routerLinkActive="active">Mois</a>
        <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
        <a routerLink="/depenses-fixes" routerLinkActive="active">Dépenses fixes</a>
        <a routerLink="/categories" routerLinkActive="active">Catégories</a>
        <a routerLink="/reglages" routerLinkActive="active">Réglages</a>
      </nav>

      <div class="right">
        @if (showMonthPicker()) {
          <app-month-picker
            [months]="data.sortedMonths()"
            [selectedId]="data.currentMonth()?.id ?? null"
            [open]="open() === 'months'"
            (openChange)="onMonthsOpenChange($event)"
            (monthSelected)="goToMonth($event)"
          />
        }

        <div class="account">
          <button
            class="avatar"
            type="button"
            aria-label="Menu du compte"
            [attr.aria-expanded]="open() === 'account'"
            (click)="toggle('account')"
          >
            {{ initial() }}
          </button>
          @if (open() === 'account') {
            <div class="popover account-menu">
              <span class="email">{{ supabase.user()?.email }}</span>
              <button type="button" class="menu-item" (click)="logout()">Se déconnecter</button>
            </div>
          }
        </div>

        <button
          class="burger"
          type="button"
          aria-label="Menu"
          [attr.aria-expanded]="open() === 'nav'"
          (click)="toggle('nav')"
        >
          <span></span><span></span><span></span>
        </button>
      </div>

      @if (open() === 'nav') {
        <div class="popover mobile-menu">
          <a routerLink="/mois" routerLinkActive="active">Mois</a>
          <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
          <a routerLink="/depenses-fixes" routerLinkActive="active">Dépenses fixes</a>
          <a routerLink="/categories" routerLinkActive="active">Catégories</a>
          <a routerLink="/reglages" routerLinkActive="active">Réglages</a>
          <div class="mobile-account">
            <span class="email">{{ supabase.user()?.email }}</span>
            <button type="button" class="menu-item" (click)="logout()">Se déconnecter</button>
          </div>
        </div>
      }
    </div>
  </header>

  <main class="content" [class.wide]="isWidePage()">
    <router-outlet></router-outlet>
  </main>
</div>
